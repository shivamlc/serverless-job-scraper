# specs/12-multi-environment-cicd.md
#
# Builds the container image EXACTLY ONCE per commit to main, tags it with the git
# SHA, pushes to the one shared ECR repo (spec 12 — the ECR repo is the deliberate
# exception to per-environment naming), then auto-deploys that exact image to DEV.
# UAT/PROD later get the SAME tag via promote.yml — never a separate rebuild.
name: Build and deploy to dev

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: serverless-job-scraper
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy-dev:
    needs: [build-and-push-image]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      image_tag: ${{ needs.build-and-push-image.outputs.image_tag }}
    secrets: inherit

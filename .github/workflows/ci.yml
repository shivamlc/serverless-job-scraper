# specs/10-cicd-pipeline.md, specs/12-multi-environment-cicd.md
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write # GitHub OIDC → AWS role, for terraform plan
  contents: read
  pull-requests: write # to post the terraform plan as a PR comment

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  integration-tests:
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: dynamodb,s3,sqs
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Integration tests (against LocalStack)
        env:
          LOCALSTACK_ENDPOINT: http://localhost:4566
        run: npm run test:integration

  terraform-plan:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    # specs/12 — plan against DEV only. UAT/PROD are never auto-planned on a PR; a
    # human sees their plan as part of triggering promote.yml deliberately.
    environment: dev
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4

      - name: terraform fmt (check only)
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: terraform init (no backend — validate only)
        working-directory: terraform
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: terraform
        run: terraform validate

      # specs/08, specs/10 — GitHub OIDC assumes a scoped AWS role. No long-lived
      # AWS access keys are ever stored as repo secrets.
      - name: Configure AWS credentials via OIDC
        if: ${{ vars.AWS_TERRAFORM_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init (with real backend, dev's state key)
        if: ${{ vars.AWS_TERRAFORM_ROLE_ARN != '' }}
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="key=serverless-job-scraper/dev/terraform.tfstate"

      - name: terraform plan (dev)
        if: ${{ vars.AWS_TERRAFORM_ROLE_ARN != '' }}
        working-directory: terraform
        env:
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
        run: |
          terraform plan -no-color -input=false \
            -var-file="envs/dev.tfvars" \
            -var="container_image_uri=${{ vars.ECR_REPOSITORY_URL }}:bootstrap" \
            -out=tfplan.binary | tee plan_output.txt

      - name: Comment plan on PR
        if: ${{ github.event_name == 'pull_request' && vars.AWS_TERRAFORM_ROLE_ARN != '' }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan_output.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform Plan\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`,
            });

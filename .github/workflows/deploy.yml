# specs/12-multi-environment-cicd.md
#
# Reusable deploy workflow — one place that knows how to `terraform apply` to an
# environment, called by build.yml (auto-deploy to dev) and promote.yml (manual
# promotion to uat/prod). Never invoked directly.
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: 'dev | uat | prod'
        required: true
        type: string
      image_tag:
        description: 'Image tag already pushed to the shared ECR repo (e.g. sha-abc1234) — deployed as-is, never rebuilt.'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    # Ties this job to the matching GitHub Environment, so its branch/reviewer
    # protection rules (specs/12's table) apply automatically — dev auto-proceeds,
    # prod blocks on a required reviewer.
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init (environment-scoped state key)
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="key=serverless-job-scraper/${{ inputs.environment }}/terraform.tfstate"

      - name: terraform apply
        working-directory: terraform
        env:
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
        run: |
          terraform apply -auto-approve -input=false \
            -var-file="envs/${{ inputs.environment }}.tfvars" \
            -var="container_image_uri=${{ vars.ECR_REPOSITORY_URL }}:${{ inputs.image_tag }}"

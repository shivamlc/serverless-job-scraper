# specs/10-cicd-pipeline.md
#
# The ONLY workflow in this repo allowed to hit the real live site. Runs on a
# schedule, not on PRs — never a required check, so an external site hiccup can
# never block an unrelated merge (see specs/00, specs/11).
name: Live smoke test

on:
  schedule:
    - cron: '0 22 * * 0' # weekly, Sunday 22:00 UTC (~08:00 AEST Monday)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write # "Notify on failure" opens an issue via github.rest.issues.create

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run adapters against the real live site (small scope)
        run: npm run test:live-smoke

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Live smoke test failed — ${new Date().toISOString().slice(0, 10)}`,
              body: 'The weekly live smoke test against the real job site(s) failed. This likely means a site changed its markup — see specs/03 and the adapter for the affected source. This is NOT necessarily caused by a recent code change (see specs/10 — this workflow is deliberately isolated from the PR merge gate).',
              labels: ['live-smoke-test-failure'],
            });

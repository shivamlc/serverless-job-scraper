services:
  localstack:
    image: localstack/localstack:3
    ports:
      - '4566:4566'
    environment:
      - SERVICES=dynamodb,s3,sqs
      - DEBUG=0
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 2s
      timeout: 5s
      retries: 30

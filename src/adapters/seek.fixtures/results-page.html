<!DOCTYPE html>
<!--
  Purpose: a SEEK result-list page with 3 job cards AND a next-page control.
  Exercises: seekAdapter.listJobLinks's single-page job-card extraction, and its
  "is there a next page" branch (paired with results-page-last.html for the
  "no next page" branch). See specs/03-seek-adapter.md.
  Used by: tests/unit/seekAdapter.test.ts, tests/integration/seekAdapterNavigation.integration.test.ts.
-->
<html>
<body>
  <div id="results">
    <article data-card-type="JobCard">
      <a data-automation="jobTitle" href="https://au.seek.com/job/11111111?type=standard&ref=search-standalone">
        Senior Software Engineer
      </a>
    </article>
    <article data-card-type="JobCard">
      <a data-automation="jobTitle" href="https://au.seek.com/job/22222222?type=standard&ref=search-standalone">
        Backend Engineer
      </a>
    </article>
    <article data-card-type="JobCard">
      <a data-automation="jobTitle" href="https://au.seek.com/job/33333333?type=standard&ref=search-standalone">
        Full Stack Developer
      </a>
    </article>
  </div>
  <nav>
    <button data-automation="page-next" aria-label="Next">Next</button>
  </nav>
</body>
</html>
